<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%" role="img" aria-label="Oliver Zhang — The Board, The Cage, The Kernel, and A Hundred Doors">
  <defs>
    <filter id="sketch-v2" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="caged-hatch-v2" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9B3B2E" stroke-width="1" stroke-opacity="0.38"/>
    </pattern>

    <linearGradient id="spill-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E5A93C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0.0"/>
    </linearGradient>

    <style>
      .v2-name  { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace; font-size: 15px; font-weight: 700; fill: #1F1E1B; letter-spacing: 2px; }
      .v2-sub   { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #5E5950; letter-spacing: 0.9px; }
      .v2-note  { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace; font-size: 10px; fill: #5E5950; }
      .v2-liter { font-family: Georgia, 'Songti SC', serif; font-size: 13px; font-style: italic; fill: #2B2925; }
      .v2-zh    { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif; font-size: 12px; fill: #2B2925; letter-spacing: 0.8px; }
      .v2-seal  { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #B03A2E; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Warm Handmade Paper Sheet -->
  <rect width="980" height="560" rx="8" fill="#F4EFE4"/>
  <rect x="12" y="12" width="956" height="536" rx="4" fill="none" stroke="#2B2925" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Left Margin Column: Identity, Coordinates & Kronecker Counterexample Seal -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="v2-name">OLIVER ZHANG</text>
    <text x="0" y="20" class="v2-sub">github.com/LibertychaserUS</text>
    <text x="0" y="42" class="v2-note">London · Suzhou · Shenzhen</text>
    <text x="0" y="58" class="v2-note">2025.04 — present · 662 contributions (12m)</text>

    <line x1="0" y1="128" x2="908" y2="128" stroke="#2B2925" stroke-width="0.7" stroke-opacity="0.4"/>

    <!-- Hand-Inked Counterexample Stamp: Conjecture 00000000408 -->
    <g transform="translate(300, 0)" filter="url(#sketch-v2)">
      <text x="0" y="0" class="v2-seal">CONJECTURE 00000000408 — DISPROVED</text>
      <!-- Three (2,1) Ferrers diagrams -->
      <g transform="translate(0, 12)">
        <g transform="translate(0,0)" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.3">
          <rect x="0" y="0" width="14" height="14"/><rect x="14" y="0" width="14" height="14"/><rect x="0" y="14" width="14" height="14" fill="#E6DFD1"/>
        </g>
        <text x="36" y="19" class="v2-note">⊗</text>
        <g transform="translate(46,0)" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.3">
          <rect x="0" y="0" width="14" height="14"/><rect x="14" y="0" width="14" height="14"/><rect x="0" y="14" width="14" height="14" fill="#E6DFD1"/>
        </g>
        <text x="82" y="19" class="v2-note">⊗</text>
        <g transform="translate(92,0)" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.3">
          <rect x="0" y="0" width="14" height="14"/><rect x="14" y="0" width="14" height="14"/><rect x="0" y="14" width="14" height="14" fill="#E6DFD1"/>
        </g>
        <text x="130" y="13" class="v2-note" fill="#1F1E1B" font-weight="700">g = 1 (odd)</text>
        <text x="130" y="27" class="v2-seal">n = 2 ∉ {1, 3, 6…}</text>
      </g>
      <text x="0" y="58" class="v2-note">Lean 4.19 · 0 sorry · no native_decide</text>
    </g>

    <!-- Core Thesis Quotes -->
    <g transform="translate(610, 0)">
      <text x="0" y="0" class="v2-liter">“Keep goals reachable, make unsafe</text>
      <text x="0" y="18" class="v2-liter">states unreachable, and prune invalid</text>
      <text x="0" y="36" class="v2-liter">paths after verification.”</text>
      <text x="0" y="66" class="v2-zh">先划边界，再谈自由。</text>
      <text x="0" y="88" class="v2-note">the door opens in its own shape;</text>
      <text x="0" y="103" class="v2-note">open doors keep their light.</text>
    </g>
  </g>

  <!-- Center-Right Unified Architectural Stage:
       Horizon of Doors on Their Own Clocks + Perspective Reachability Chess Floor -->
  <g transform="translate(120, 204)">
    <!-- Horizon Line at y = 148 -->
    <line x1="20" y1="148" x2="840" y2="148" stroke="#2B2925" stroke-width="1.4" filter="url(#sketch-v2)"/>

    <!-- 100-Door Calibration Scale Above Horizon -->
    <line x1="60" y1="24" x2="800" y2="24" stroke="#2B2925" stroke-width="0.6" stroke-opacity="0.45"/>
    <text x="60" y="16" class="v2-note">DOOR 001</text>
    <text x="430" y="16" text-anchor="middle" class="v2-note">· · · 一百扇按各自时辰开的门 · DOORS ON THEIR OWN CLOCKS · · ·</text>
    <text x="800" y="16" text-anchor="end" class="v2-note">DOOR 100</text>

    <!-- Perspective Chessboard Floor (Trapezoid receding to horizon y=148, front baseline y=312) -->
    <g filter="url(#sketch-v2)">
      <polygon points="150,148 710,148 830,312 30,312" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.5"/>

      <!-- Caged-Out Unsafe Regions on the Perspective Board (Left & Right Flanks) -->
      <polygon points="150,148 290,148 255,220 97,220" fill="url(#caged-hatch-v2)"/>
      <polygon points="570,148 710,148 763,220 605,220" fill="url(#caged-hatch-v2)"/>
      <polygon points="605,220 763,220 830,312 640,312" fill="url(#caged-hatch-v2)"/>

      <!-- Perspective Grid Ranks (Horizontal lines at y=164, 182, 200, 220, 241, 263, 287) -->
      <g stroke="#2B2925" stroke-width="0.55" stroke-opacity="0.38">
        <line x1="138" y1="164" x2="722" y2="164"/>
        <line x1="125" y1="182" x2="735" y2="182"/>
        <line x1="111" y1="200" x2="749" y2="200"/>
        <line x1="97"  y1="220" x2="763" y2="220"/>
        <line x1="82"  y1="241" x2="778" y2="241"/>
        <line x1="66"  y1="263" x2="794" y2="263"/>
        <line x1="49"  y1="287" x2="811" y2="287"/>
      </g>

      <!-- Perspective Grid Files (Converging rays from horizon to baseline) -->
      <g stroke="#2B2925" stroke-width="0.55" stroke-opacity="0.38">
        <line x1="220" y1="148" x2="130" y2="312"/>
        <line x1="290" y1="148" x2="230" y2="312"/>
        <line x1="360" y1="148" x2="330" y2="312"/>
        <line x1="430" y1="148" x2="430" y2="312"/>
        <line x1="500" y1="148" x2="530" y2="312"/>
        <line x1="570" y1="148" x2="630" y2="312"/>
        <line x1="640" y1="148" x2="730" y2="312"/>
      </g>

      <!-- Hard Cage Boundary Walls (Vermilion Ink) -->
      <polyline points="290,148 255,220 97,220" fill="none" stroke="#B03A2E" stroke-width="2.2"/>
      <polyline points="570,148 640,312" fill="none" stroke="#B03A2E" stroke-width="2.2"/>
    </g>

    <!-- Seven Architectural Doors Standing Along the Horizon (y=148) -->
    <!-- Door A (x=185, Closed) -->
    <g transform="translate(167, 74)" filter="url(#sketch-v2)">
      <rect x="0" y="0" width="36" height="74" fill="#EAE3D4" stroke="#1F1E1B" stroke-width="1.4"/>
      <line x1="18" y1="0" x2="18" y2="74" stroke="#2B2925" stroke-width="0.8"/>
    </g>

    <!-- Door B (x=285, Roman Arch — OPEN on 9s cycle, casts light across reachable board) -->
    <g transform="translate(263, 62)">
      <circle cx="22" cy="-14" r="8" fill="#FAF7F0" stroke="#2B2925" stroke-width="1"/>
      <line x1="22" y1="-14" x2="22" y2="-20" stroke="#1F1E1B" stroke-width="1.1">
        <animateTransform attributeName="transform" type="rotate" from="0 22 -14" to="360 22 -14" dur="9s" repeatCount="indefinite"/>
      </line>
      <polygon points="4,86 40,86 15,248 -85,248" fill="url(#spill-gold)">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <path d="M 4 86 L 4 22 A 18 18 0 0 1 40 22 L 40 86 Z" fill="#F2C15A" stroke="#1F1E1B" stroke-width="1.5">
        <animate attributeName="fill-opacity" values="0.95;0.3;0.95" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M 4 86 L 4 22 L 16 14 L 16 78 Z" fill="#2B2925" fill-opacity="0.85"/>
    </g>

    <!-- Door C (x=380, Narrow Stepped — Closed) -->
    <g transform="translate(364, 68)" filter="url(#sketch-v2)">
      <path d="M 0 80 L 0 14 L 16 0 L 32 14 L 32 80 Z" fill="#EAE3D4" stroke="#1F1E1B" stroke-width="1.4"/>
      <circle cx="16" cy="24" r="4" fill="none" stroke="#2B2925" stroke-width="1"/>
    </g>

    <!-- Door D (x=465, Center Goal Portal — OPEN on 13s cycle, Goal of the Knight Trajectory) -->
    <g transform="translate(441, 52)">
      <circle cx="24" cy="-14" r="8" fill="#FAF7F0" stroke="#2B2925" stroke-width="1"/>
      <line x1="24" y1="-14" x2="24" y2="-20" stroke="#1F1E1B" stroke-width="1.1">
        <animateTransform attributeName="transform" type="rotate" from="0 24 -14" to="360 24 -14" dur="13s" repeatCount="indefinite"/>
      </line>
      <polygon points="4,96 44,96 76,260 -28,260" fill="url(#spill-gold)">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="13s" repeatCount="indefinite"/>
      </polygon>
      <path d="M 4 96 L 4 24 L 24 4 L 44 24 L 44 96 Z" fill="#F2C15A" stroke="#1F1E1B" stroke-width="1.6">
        <animate attributeName="fill-opacity" values="0.5;0.95;0.5" dur="13s" repeatCount="indefinite"/>
      </path>
      <path d="M 44 96 L 44 24 L 31 16 L 31 88 Z" fill="#2B2925" fill-opacity="0.85"/>
    </g>

    <!-- Door E (x=560, Double Arch — OPEN on 19s cycle) -->
    <g transform="translate(540, 66)">
      <circle cx="20" cy="-14" r="8" fill="#FAF7F0" stroke="#2B2925" stroke-width="1"/>
      <line x1="20" y1="-14" x2="20" y2="-20" stroke="#1F1E1B" stroke-width="1.1">
        <animateTransform attributeName="transform" type="rotate" from="0 20 -14" to="360 20 -14" dur="19s" repeatCount="indefinite"/>
      </line>
      <polygon points="4,82 36,82 88,246 18,246" fill="url(#spill-gold)">
        <animate attributeName="opacity" values="0.85;0.25;0.85" dur="19s" repeatCount="indefinite"/>
      </polygon>
      <rect x="4" y="14" width="32" height="68" fill="#F2C15A" stroke="#1F1E1B" stroke-width="1.5">
        <animate attributeName="fill-opacity" values="0.9;0.35;0.9" dur="19s" repeatCount="indefinite"/>
      </rect>
      <path d="M 4 82 L 4 14 L 15 8 L 15 76 Z" fill="#2B2925" fill-opacity="0.85"/>
    </g>

    <!-- Door F (x=660, Caged-out Ruin Door behind Unsafe Wall) -->
    <g transform="translate(644, 76)" opacity="0.55" filter="url(#sketch-v2)">
      <rect x="0" y="0" width="32" height="72" fill="#E2DBD0" stroke="#6E685F" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>

    <!-- Verified Trajectory on the Board Floor + Pruned Unsafe Branches -->
    <!-- Pruned branch 1 (left into cage wall) -->
    <path d="M 380 252 L 265 210" fill="none" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="3 3"/>
    <g transform="translate(265, 210)" stroke="#B03A2E" stroke-width="2">
      <line x1="-5" y1="-5" x2="5" y2="5"/><line x1="-5" y1="5" x2="5" y2="-5"/>
    </g>

    <!-- Pruned branch 2 (right into cage wall) -->
    <path d="M 480 210 L 598 205" fill="none" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="3 3"/>
    <g transform="translate(598, 205)" stroke="#B03A2E" stroke-width="2">
      <line x1="-5" y1="-5" x2="5" y2="5"/><line x1="-5" y1="5" x2="5" y2="-5"/>
    </g>

    <!-- Verified Reachable Path from Front Board (280, 298) -> (380, 252) -> (480, 210) -> (465, 148 Center Door) -->
    <path d="M 280 298 L 380 252 L 480 210 L 465 148" fill="none" stroke="#1F1E1B" stroke-width="2.2"/>
    <circle cx="280" cy="298" r="4.5" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.8"/>
    <circle cx="380" cy="252" r="4" fill="#1F1E1B"/>
    <circle cx="480" cy="210" r="4" fill="#1F1E1B"/>
    <circle cx="465" cy="148" r="7" fill="none" stroke="#2E6B4E" stroke-width="1.8">
      <animate attributeName="r" values="6;9;6" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Token Moving Along Reachable Path to the Open Door -->
    <circle r="5.5" fill="#D9822B" stroke="#1F1E1B" stroke-width="1.4">
      <animateMotion path="M 280 298 L 380 252 L 480 210 L 465 148" keyPoints="0;0.35;0.72;1;1" keyTimes="0;0.3;0.62;0.88;1" calcMode="linear" dur="8.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom Legend under Board -->
    <text x="30" y="332" class="v2-note">■ CAGE BOUNDARY (UNSAFE UNREACHABLE)</text>
    <text x="315" y="332" class="v2-note">✕ PRUNED AFTER VERIFICATION</text>
    <text x="545" y="332" class="v2-note">● → ★ REACHABLE GOAL &amp; OPEN DOOR</text>
  </g>
</svg>
