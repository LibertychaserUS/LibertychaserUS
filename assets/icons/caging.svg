<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Caging Engineering">
  <rect x="3" y="3" width="42" height="42" rx="8" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.5"/>
  <!-- Hatching in top-right unsafe corner -->
  <path d="M 26 3 L 45 22 M 32 3 L 45 16 M 38 3 L 45 10" stroke="#B03A2E" stroke-width="1.1" stroke-opacity="0.55"/>
  <!-- Cage boundary wall -->
  <path d="M 24 3 L 24 22 L 45 22" fill="none" stroke="#B03A2E" stroke-width="2"/>
  <!-- Reachable path to goal -->
  <path d="M 11 36 L 18 27 L 33 34" fill="none" stroke="#1F1E1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11" cy="36" r="2.2" fill="#1F1E1B"/>
  <circle cx="33" cy="34" r="4" fill="none" stroke="#2E6B4E" stroke-width="1.6">
    <animate attributeName="r" values="3.5;5;3.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="33" cy="34" r="1.8" fill="#2E6B4E"/>
</svg>
