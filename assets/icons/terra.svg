<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Terra">
  <rect x="3" y="3" width="42" height="42" rx="8" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.5"/>
  <!-- Outer Cage Frame -->
  <rect x="10" y="10" width="28" height="28" rx="3" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.6"/>
  <!-- Audit Log Horizontal Lines -->
  <line x1="15" y1="17" x2="27" y2="17" stroke="#2B2925" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="24" x2="31" y2="24" stroke="#2B2925" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="31" x2="23" y2="31" stroke="#2B2925" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gate Seal Dot -->
  <circle cx="32" cy="31" r="2.8" fill="#D9822B">
    <animate attributeName="opacity" values="1;0.35;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
