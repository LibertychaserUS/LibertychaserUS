    <g transform="translate(44, 18)" filter="url(#tile-ink)">
      <rect x="0" y="0" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="17" y="0" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="34" y="0" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="17" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="17" y="17" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="34" y="17" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="34" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="17" y="34" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="34" y="34" width="13" height="13" rx="1.5" fill="#2E6B4E" stroke="#1F1E1B" stroke-width="1.2">
        <animate attributeName="fill-opacity" values="0.95;0.25;0.95" dur="4.5s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">CUDA</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">kernels · tilelang</text>
  </g>

  <!-- 3. MLIR -->
  <g transform="translate(308, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <!-- Multi-Level IR Lowering Graph -->
    <g transform="translate(68, 42)" filter="url(#tile-ink)">
      <!-- Level 1 (High IR) -->
      <rect x="-24" y="-24" width="48" height="11" rx="2" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.4"/>
      <!-- Level 2 (Tile IR) -->
      <rect x="-18" y="-5" width="36" height="11" rx="2" fill="#EAE4D7" stroke="#1F1E1B" stroke-width="1.4"/>
      <!-- Level 3 (Target ASM) -->
      <rect x="-12" y="14" width="24" height="11" rx="2" fill="#D9822B" fill-opacity="0.35" stroke="#1F1E1B" stroke-width="1.4"/>
      <!-- Lowering edges -->
      <line x1="0" y1="-13" x2="0" y2="-5" stroke="#B03A2E" stroke-width="1.5"/>
      <line x1="0" y1="6" x2="0" y2="14" stroke="#B03A2E" stroke-width="1.5"/>
      <!-- Animated lowering token -->
      <circle cx="0" cy="-19" r="2.2" fill="#B03A2E">
        <animate attributeName="cy" values="-18;0;19;-18" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">MLIR</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">dialect lowering</text>
  </g>

