  <!-- 8. Go -->
  <g transform="translate(1056, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <g transform="translate(68, 43)" filter="url(#tile-ink)">
      <rect x="-24" y="-20" width="48" height="40" rx="18" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" class="glyph-mono" font-size="15">&lt;-go</text>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">Go</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">infra · tooling</text>
