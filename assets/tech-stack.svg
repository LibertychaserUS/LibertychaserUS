  <g transform="translate(608, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <!-- Dual Interlocked Channels -->
    <g transform="translate(68, 43)" filter="url(#tile-ink)">
      <path d="M -14 -6 L -14 -16 C -14 -21, 10 -21, 10 -16 L 10 0 L -6 0 C -14 0, -18 5, -18 11 L -18 14" fill="none" stroke="#1F1E1B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 14 6 L 14 16 C 14 21, -10 21, -10 16 L -10 0 L 6 0 C 14 0, 18 -5, 18 -11 L 18 -14" fill="none" stroke="#D9822B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-6" cy="-14" r="1.8" fill="#1F1E1B"/>
      <circle cx="6" cy="14" r="1.8" fill="#D9822B"/>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">Python</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">compile_only · audit</text>
  </g>

  <!-- 6. Lean 4 -->
  <g transform="translate(758, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <!-- Formal Proof Turnstile Seal -->
    <g transform="translate(68, 43)" filter="url(#tile-ink)">
      <rect x="-24" y="-22" width="48" height="44" rx="3" fill="#FAF7F0" stroke="#B03A2E" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" class="glyph-mono" font-size="18" fill="#B03A2E">∀ ⊢</text>
      <circle cx="17" cy="-15" r="2.5" fill="#B03A2E">
        <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">Lean 4</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">0 sorry · kernel</text>
  </g>

  <!-- 7. TypeScript -->
  <g transform="translate(908, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <g transform="translate(68, 43)" filter="url(#tile-ink)">
