      <line x1="-16" y1="-12" x2="16" y2="-12" stroke="#2B2925" stroke-width="0.8" stroke-dasharray="2 2"/>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">TypeScript</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">Compiler Explorer · web</text>
