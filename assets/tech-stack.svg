<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="100%" height="100%" role="img" aria-label="Tech Stack: C++ · CUDA · MLIR · Rust · Python · Lean 4 · TypeScript · Go">
  <defs>
    <filter id="tile-ink" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .stack-name { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #1F1E1B; letter-spacing: 0.6px; }
      .stack-sub  { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 9.5px; fill: #6E685F; letter-spacing: 0.3px; }
      .glyph-mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; font-weight: 700; fill: #1F1E1B; }
    </style>
  </defs>

  <!-- 8 Large Icon Cards across 1200px (each 136px wide, 14px gap) -->

  <!-- 1. C++ -->
  <g transform="translate(8, 6)">
    <rect width="136" height="120" rx="6" fill="#F5F1E8" stroke="#2B2925" stroke-width="1.2"/>
    <g transform="translate(68, 44)" filter="url(#tile-ink)">
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FAF7F0" stroke="#1F1E1B" stroke-width="1.6"/>
      <text x="-14" y="6" class="glyph-mono" font-size="17">C</text>
      <g stroke="#B03A2E" stroke-width="1.8" stroke-linecap="round">
        <line x1="2" y1="0" x2="10" y2="0"/><line x1="6" y1="-4" x2="6" y2="4"/>
        <line x1="13" y1="0" x2="21" y2="0"/><line x1="17" y1="-4" x2="17" y2="4"/>
      </g>
    </g>
    <text x="68" y="94" text-anchor="middle" class="stack-name">C++</text>
    <text x="68" y="109" text-anchor="middle" class="stack-sub">systems · codegen</text>
  </g>

  <!-- 2. CUDA -->
  <g transform="translate(158, 6)">
